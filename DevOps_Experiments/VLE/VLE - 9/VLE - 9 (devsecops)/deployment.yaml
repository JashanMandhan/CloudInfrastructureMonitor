apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: healthcare-app

  template:
    metadata:
      labels:
        app: healthcare-app

    spec:
      containers:
        - name: healthcare-container
          image: healthcare-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000