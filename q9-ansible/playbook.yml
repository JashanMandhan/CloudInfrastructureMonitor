---
- name: Q9 - Setup and Run Ansible Playbook
  hosts: localhost
  connection: local
  tasks:
    - name: Print student info
      debug:
        msg: "I am Jashanveer Mandhan RA2311003010204 from SRMIST."

    - name: Check system info
      command: hostname
      register: host_info

    - name: Display hostname
      debug:
        msg: "Hostname is {{ host_info.stdout }}"

    - name: Create a sample file
      copy:
        content: "Ansible Playbook executed successfully by Jashanveer"
        dest: ./ansible_output.txt

    - name: Verify file created
      command: type ansible_output.txt
      register: file_content

    - name: Show file content
      debug:
        msg: "{{ file_content.stdout }}"